<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Execution Order</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background: #f4f5f7;
      font-family: Arial, Helvetica, sans-serif;
      color: #202124;
    }

    #root {
      padding: 8px 10px;
      box-sizing: border-box;
      min-width: 100%;
    }

    #note {
      color: #6b7280;
      font-size: 11px;
      line-height: 1.25;
      margin-bottom: 7px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #track {
      display: flex;
      align-items: center;
      gap: 7px;
      min-height: 66px;
      width: max-content;
      padding: 2px 0 5px 0;
      box-sizing: border-box;
    }

    .step {
      display: inline-flex;
      flex-direction: column;
      justify-content: center;
      gap: 2px;
      min-width: 94px;
      max-width: 142px;
      height: 54px;
      padding: 6px 9px;
      background: #ffffff;
      border: 1px solid #d2d6dd;
      border-radius: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      cursor: pointer;
      box-sizing: border-box;
    }

    .step:hover {
      border-color: #aeb7c2;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }

    .step.selected {
      border: 2px solid #2f78ff;
      box-shadow: 0 0 0 2px rgba(47,120,255,0.12);
    }

    .stepHeader {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      min-width: 0;
    }

    .stepTitle {
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    .stepTag {
      color: #5f6368;
      font-size: 10px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    .orderBadge {
      flex: 0 0 auto;
      min-width: 18px;
      text-align: center;
      padding: 1px 5px;
      border-radius: 999px;
      background: #eef2f7;
      font-size: 9px;
      font-weight: 700;
      line-height: 1.35;
    }

    .runtimeIcon {
      margin-left: 3px;
      font-weight: 700;
      font-size: 10px;
      line-height: 1;
    }

    .connector {
      position: relative;
      flex: 0 0 18px;
      width: 18px;
      height: 12px;
    }

    .connector::before {
      content: "";
      position: absolute;
      left: 0;
      right: 5px;
      top: 50%;
      transform: translateY(-50%);
      border-top: 2px solid #8c99a5;
    }

    .connector::after {
      content: "";
      position: absolute;
      right: 0;
      top: 50%;
      width: 0;
      height: 0;
      transform: translateY(-50%);
      border-left: 5px solid #8c99a5;
      border-top: 4px solid transparent;
      border-bottom: 4px solid transparent;
    }

    #hint {
      color: #7a7a7a;
      font-size: 12px;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div id="root">
    <div id="note"></div>
    <div id="track"></div>
    <div id="hint">No executable steps available.</div>
  </div>

  <script>
    let htmlComponent = null;
    let model = { steps: [], selectedNodeID: null, note: "" };

    function setup(component) {
      htmlComponent = component;
      htmlComponent.addEventListener("DataChanged", function() { applyData(); });
      applyData();
      htmlComponent.sendEventToMATLAB("htmlReady", { component: "execution" });
    }

    function normalizeToArray(value) {
      if (Array.isArray(value)) {
        return value;
      }
      if (value === undefined || value === null) {
        return [];
      }
      if (typeof value === "object") {
        return [value];
      }
      return [];
    }

    function numericValue(value) {
      const n = Number(value);
      return Number.isFinite(n) ? n : NaN;
    }

    function firstNonEmpty() {
      for (let i = 0; i < arguments.length; i++) {
        const value = arguments[i];
        if (value !== undefined && value !== null && String(value).trim() !== "") {
          return value;
        }
      }
      return "";
    }

    function getRunIndex(step, fallbackIndex) {
      const runIndex = numericValue(step.runIndex);
      if (Number.isFinite(runIndex)) {
        return runIndex;
      }

      const orderIndex = numericValue(step.orderIndex);
      if (Number.isFinite(orderIndex)) {
        return orderIndex;
      }

      return fallbackIndex + 1;
    }

    function applyData() {
      const d = (htmlComponent && htmlComponent.Data) ? htmlComponent.Data : {};

      model.steps = normalizeToArray(d.steps);
      model.steps = model.steps.filter(function(step) {
        const role = String(step.executionRole || "").toLowerCase();
        const kind = String(step.kind || "").toLowerCase();

        if (role === "virtual_source" || kind === "folder") {
          return false;
        }
        if (Object.prototype.hasOwnProperty.call(step, "isExecutable")) {
          return Boolean(step.isExecutable);
        }
        return true;
      });

      model.steps.sort(function(a, b) {
        return getRunIndex(a, 0) - getRunIndex(b, 0);
      });

      model.selectedNodeID = Object.prototype.hasOwnProperty.call(d, "selectedNodeID") ? d.selectedNodeID : null;
      model.note = d.note || "Executable run order. File sources are virtual inputs and are loaded only when consumed.";
      render();
    }

    function render() {
      const note = document.getElementById("note");
      const track = document.getElementById("track");
      const hint = document.getElementById("hint");

      note.textContent = model.note || "";
      track.innerHTML = "";

      if (!model.steps.length) {
        hint.style.display = "block";
        return;
      }

      hint.style.display = "none";

      model.steps.forEach(function(step, idx) {
        const card = document.createElement("div");
        card.className = "step" + ((step.id === model.selectedNodeID) ? " selected" : "");

        const runIndex = getRunIndex(step, idx);
        const titleText = firstNonEmpty(step.funcName, step.functionName, "Analysis step");
        const tagText = firstNonEmpty(step.stepTag, step.stepName, "");
        const runtimeIcon = firstNonEmpty(step.runtimeIcon, "");
        const runtimeState = firstNonEmpty(step.runtimeState, "");
        const scheduleIndex = firstNonEmpty(step.scheduleIndex, "");
        const topoIndex = firstNonEmpty(step.topoIndex, "");
        const inputSummary = firstNonEmpty(step.inputSummary, "");
        const outputSummary = firstNonEmpty(step.outputSummary, "");

        const titleWithIcon = `${esc(titleText)}${runtimeIcon ? `<span class="runtimeIcon">${esc(runtimeIcon)}</span>` : ""}`;
        const tooltipParts = [
          `Run order: ${runIndex}`,
          `Step: ${tagText}`,
          `Function: ${titleText}`
        ];

        if (scheduleIndex !== "") { tooltipParts.push(`Schedule index: ${scheduleIndex}`); }
        if (topoIndex !== "") { tooltipParts.push(`Topological order: ${topoIndex}`); }
        if (runtimeState !== "") { tooltipParts.push(`Runtime: ${runtimeState}`); }
        if (inputSummary !== "") { tooltipParts.push(`Inputs: ${inputSummary}`); }
        if (outputSummary !== "") { tooltipParts.push(`Outputs: ${outputSummary}`); }

        card.title = tooltipParts.join("\n");
        card.innerHTML = `
          <div class="stepHeader">
            <div class="stepTitle" title="${esc(titleText)}">${titleWithIcon}</div>
            <div class="orderBadge">#${esc(runIndex)}</div>
          </div>
          <div class="stepTag" title="${esc(tagText)}">${esc(tagText)}</div>`;

        card.addEventListener("click", function() {
          if (htmlComponent) {
            htmlComponent.sendEventToMATLAB("stepSelected", {
              nodeID: step.id,
              stepTag: step.stepTag || step.stepName || "",
              funcName: step.funcName || step.functionName || ""
            });
          }
        });

        track.appendChild(card);

        if (idx < model.steps.length - 1) {
          const connector = document.createElement("div");
          connector.className = "connector";
          track.appendChild(connector);
        }
      });
    }

    function esc(value) {
      return String((value === undefined || value === null) ? "" : value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }
  </script>
</body>
</html>
