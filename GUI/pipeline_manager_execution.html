<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Execution Order</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background: #f4f5f7;
      font-family: Arial, Helvetica, sans-serif;
    }

    #root {
      padding: 10px;
      box-sizing: border-box;
      min-width: 100%;
    }

    #note {
      color: #6b7280;
      font-size: 11px;
      margin-bottom: 8px;
    }

    #track {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 72px;
      width: max-content;
      padding-bottom: 4px;
    }

    .step {
      display: inline-flex;
      flex-direction: column;
      justify-content: center;
      gap: 2px;
      min-width: 96px;
      max-width: 150px;
      padding: 7px 10px;
      background: #ffffff;
      border: 1px solid #d2d6dd;
      border-radius: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      cursor: pointer;
      box-sizing: border-box;
    }

    .step.selected {
      border: 2px solid #2f78ff;
      box-shadow: 0 0 0 2px rgba(47,120,255,0.12);
    }

    .stepHeader {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-width: 0;
    }

    .stepTitle {
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    .stepTag {
      color: #5f6368;
      font-size: 10px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    .orderBadge {
      flex: 0 0 auto;
      padding: 1px 5px;
      border-radius: 999px;
      background: #eef2f7;
      font-size: 9px;
      line-height: 1.35;
    }

    .connector {
      position: relative;
      flex: 0 0 18px;
      width: 18px;
      height: 12px;
    }

    .connector::before {
      content: "";
      position: absolute;
      left: 0;
      right: 5px;
      top: 50%;
      transform: translateY(-50%);
      border-top: 2px solid #8c99a5;
    }

    .connector::after {
      content: "";
      position: absolute;
      right: 0;
      top: 50%;
      width: 0;
      height: 0;
      transform: translateY(-50%);
      border-left: 5px solid #8c99a5;
      border-top: 4px solid transparent;
      border-bottom: 4px solid transparent;
    }

    #hint {
      color: #7a7a7a;
      font-size: 12px;
    }

    /* Runtime execution state ------------------------------------------------ */
    body.interaction-disabled {
      cursor: progress;
    }

    body.interaction-disabled .step,
    body.interaction-disabled button {
      pointer-events: none !important;
    }

    .step {
      position: relative;
    }

    .runtime-pending {
      opacity: 0.38;
      filter: grayscale(0.65);
    }

    .runtime-running {
      border-color: #2f80ed !important;
      box-shadow: 0 0 0 3px rgba(47,128,237,0.20), 0 8px 22px rgba(47,128,237,0.18) !important;
    }

    .runtime-stopping {
      border-color: #cc7a00 !important;
      box-shadow: 0 0 0 3px rgba(204,122,0,0.22), 0 8px 22px rgba(204,122,0,0.18) !important;
    }

    .runtime-passed {
      border-color: #2f9e44 !important;
    }

    .runtime-failed {
      border-color: #c92a2a !important;
      box-shadow: 0 0 0 3px rgba(201,42,42,0.18) !important;
    }

    .runtime-skipped {
      border-color: #868e96 !important;
      opacity: 0.70;
    }

    .runtime-icon {
      position: absolute;
      right: 6px;
      bottom: 5px;
      min-width: 16px;
      height: 16px;
      border-radius: 50%;
      font-size: 11px;
      line-height: 16px;
      text-align: center;
      font-weight: 700;
      background: #ffffff;
      color: #495057;
      border: 1px solid #cfd5dc;
      z-index: 10;
      box-sizing: border-box;
    }

    .runtime-passed .runtime-icon {
      background: #2f9e44;
      border-color: #2f9e44;
      color: #ffffff;
    }

    .runtime-failed .runtime-icon {
      background: #c92a2a;
      border-color: #c92a2a;
      color: #ffffff;
    }

    .runtime-running .runtime-icon {
      background: #2f80ed;
      border-color: #2f80ed;
      color: #ffffff;
    }

    .runtime-stopping .runtime-icon {
      background: #cc7a00;
      border-color: #cc7a00;
      color: #ffffff;
    }

    .runtime-skipped .runtime-icon {
      background: #868e96;
      border-color: #868e96;
      color: #ffffff;
    }

    #interactionLock {
      position: fixed;
      inset: 0;
      z-index: 2000;
      display: none;
      background: rgba(255,255,255,0.01);
      pointer-events: auto;
    }

    body.interaction-disabled #interactionLock {
      display: block;
    }
  </style>
</head>
<body>
  <div id="root">
    <div id="note"></div>
    <div id="track"></div>
    <div id="hint">No execution data available.</div>
  </div>
  <div id="interactionLock" title="Interactions are disabled while the pipeline is running."></div>

  <script>
    let htmlComponent = null;
    let model = { steps: [], selectedNodeID: null, note: "", runtime: {} };

    function setup(component) {
      htmlComponent = component;
      htmlComponent.addEventListener("DataChanged", function() { applyData(); });
      applyData();
      htmlComponent.sendEventToMATLAB("htmlReady", { component: "execution" });
    }

    function normalizeToArray(value) {
      if (Array.isArray(value)) {
        return value;
      }
      if (value === undefined || value === null) {
        return [];
      }
      if (typeof value === "object") {
        return [value];
      }
      return [];
    }

    function applyData() {
      const d = (htmlComponent && htmlComponent.Data) ? htmlComponent.Data : {};
      model.steps = normalizeToArray(d.steps);
      model.selectedNodeID = Object.prototype.hasOwnProperty.call(d, "selectedNodeID") ? d.selectedNodeID : null;
      model.note = d.note || "";
      model.runtime = d.runtime || {};
      render();
    }


    function getRuntime() {
      return model && model.runtime ? model.runtime : {};
    }

    function normalizeID(value) {
      if (value === undefined || value === null || value === "") {
        return null;
      }
      const n = Number(value);
      if (Number.isFinite(n)) {
        return n;
      }
      return String(value);
    }

    function idEquals(a, b) {
      const aa = normalizeID(a);
      const bb = normalizeID(b);
      return aa !== null && bb !== null && aa === bb;
    }

    function idInList(id, list) {
      const target = normalizeID(id);
      if (target === null) {
        return false;
      }
      const values = normalizeToArray(list);
      return values.some(function(v) { return normalizeID(v) === target; });
    }

    function getStepRuntimeState(step) {
      if (step && step.runtimeState && String(step.runtimeState).toLowerCase() !== "idle") {
        return String(step.runtimeState).toLowerCase();
      }

      const runtime = getRuntime();
      const stepID = step ? step.id : null;

      if (idInList(stepID, runtime.failedStepIDs)) {
        return "failed";
      }
      if (idInList(stepID, runtime.skippedStepIDs)) {
        return "skipped";
      }
      if (idInList(stepID, runtime.completedStepIDs)) {
        return "passed";
      }
      if (idEquals(stepID, runtime.currentStepID)) {
        return runtime.isStopping ? "stopping" : "running";
      }
      if (runtime.isRunning) {
        return "pending";
      }
      return "idle";
    }

    function runtimeClass(state) {
      const s = String(state || "idle").toLowerCase();
      if (["running", "stopping", "passed", "failed", "skipped", "pending"].includes(s)) {
        return "runtime-" + s;
      }
      return "";
    }

    function runtimeIconText(step, state) {
      if (step && step.runtimeIcon) {
        return String(step.runtimeIcon);
      }

      const s = String(state || "").toLowerCase();
      if (s === "passed") return "✓";
      if (s === "failed") return "✕";
      if (s === "skipped") return "↷";
      if (s === "running") return "●";
      if (s === "stopping") return "■";
      return "";
    }

    function makeRuntimeIcon(step, state) {
      const iconText = runtimeIconText(step, state);
      if (!iconText) {
        return null;
      }

      const icon = document.createElement("div");
      icon.className = "runtime-icon";
      icon.textContent = iconText;
      return icon;
    }

    function interactionIsLocked() {
      const runtime = getRuntime();
      return !!runtime.interactionDisabled || !!runtime.isRunning;
    }

    function applyInteractionLock() {
      document.body.classList.toggle("interaction-disabled", interactionIsLocked());
    }

    function render() {
      applyInteractionLock();

      const note = document.getElementById("note");
      const track = document.getElementById("track");
      const hint = document.getElementById("hint");

      note.textContent = model.note || "";
      track.innerHTML = "";

      if (!model.steps.length) {
        hint.style.display = "block";
        return;
      }

      hint.style.display = "none";

      model.steps.forEach(function(step, idx) {
        const card = document.createElement("div");
        const runtimeState = getStepRuntimeState(step);
        card.className = ["step", runtimeClass(runtimeState), (step.id === model.selectedNodeID) ? "selected" : ""].filter(Boolean).join(" ");

        const titleText = step.funcName || "";
        const tagText = step.stepTag || "";
        const fullText = `${titleText} | ${tagText} | #${step.orderIndex || ""}`;

        card.title = fullText;
        card.innerHTML = `
          <div class="stepHeader">
            <div class="stepTitle" title="${esc(titleText)}">${esc(titleText)}</div>
            <div class="orderBadge">#${step.orderIndex || ""}</div>
          </div>
          <div class="stepTag" title="${esc(tagText)}">${esc(tagText)}</div>`;

        const runtimeIcon = makeRuntimeIcon(step, runtimeState);
        if (runtimeIcon) {
          card.appendChild(runtimeIcon);
        }

        card.addEventListener("click", function() {
          if (interactionIsLocked()) { return; }
          if (htmlComponent) {
            htmlComponent.sendEventToMATLAB("stepSelected", {
              nodeID: step.id,
              stepTag: step.stepTag || "",
              funcName: step.funcName || ""
            });
          }
        });

        track.appendChild(card);

        if (idx < model.steps.length - 1) {
          const connector = document.createElement("div");
          connector.className = "connector";
          track.appendChild(connector);
        }
      });
    }

    function esc(value) {
      return String((value === undefined || value === null) ? "" : value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }
  </script>
</body>
</html>
